name: Daily Auto Update & Deploy (sysv.cn)

on:
  schedule:
    # Runs every day at 02:15 UTC (10:15 Beijing Time)
    - cron: "15 2 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "site.config.json"
      - ".github/workflows/daily-auto.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest public LLM pricing, history snapshots & curated infra repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m scripts.fetch_data

      - name: Incremental enrichment with SHA-256 hash invalidation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: python3 -m scripts.enrich_llm

      - name: Build static site into dist/
        run: python3 -m scripts.build_site

      - name: Run automated Quality Gate (blocks broken/misclassified publishes)
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python3 -m scripts.health_check

      - name: Commit data snapshots & price history (prevents 60-day cron pause)
        run: |
          git config user.name "sysv-bot"
          git config user.email "bot@sysv.cn"
          git add data/models.json data/repos.json data/price_changes.json data/history/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): daily snapshot & price history $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages (sysv.cn)
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify anomaly via PushPlus or Webhook (failure only)
        if: failure()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python3 -c '
          import json, os, urllib.request
          msg = "SysV Radar (sysv.cn) daily pipeline FAILED. Please check GitHub Actions logs."
          pp = os.getenv("PUSHPLUS_TOKEN", "").strip()
          if pp:
              payload = json.dumps({"token": pp, "title": "[SysV Radar] Pipeline Alert", "content": msg, "template": "txt"}).encode()
              req = urllib.request.Request("https://www.pushplus.plus/send", data=payload, headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req, timeout=12)
          wh = os.getenv("ALERT_WEBHOOK_URL", "").strip()
          if wh:
              payload = json.dumps({"text": msg}).encode()
              req = urllib.request.Request(wh, data=payload, headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req, timeout=12)
          '
