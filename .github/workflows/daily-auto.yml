name: Daily Auto Update & Deploy (sysv.cn)

on:
  schedule:
    # Runs every day at 02:15 UTC (10:15 Beijing Time)
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Run upstream data fetch, policy monitor & capped AI enrichment (false = fast static-only rebuild)"
        required: false
        default: true
        type: boolean
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "site.config.json"
      - "data/free_provider_policies.json"
      - ".github/workflows/daily-auto.yml"
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "site.config.json"
      - "data/free_provider_policies.json"
      - ".github/workflows/daily-auto.yml"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy_target: ${{ steps.target.outputs.host }}
      run_fetch: ${{ steps.mode.outputs.run_fetch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cryptography for GSC auth unit tests
        run: python3 -m pip install --quiet cryptography

      - name: Select mutually exclusive production deploy target
        id: target
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "host=cloudflare-pages" >> "$GITHUB_OUTPUT"
            echo "Production deploy target: cloudflare-pages (GitHub Pages skipped)"
          else
            echo "host=github-pages" >> "$GITHUB_OUTPUT"
            echo "Production deploy target: github-pages (Cloudflare Pages skipped)"
          fi

      - name: Decide full data refresh vs static-only fast rebuild
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "run_fetch=true" >> "$GITHUB_OUTPUT"
            echo "Mode: scheduled full refresh (fetch + policy check + cumulative-capped AI enrich)"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.refresh_data }}" != "false" ]; then
            echo "run_fetch=true" >> "$GITHUB_OUTPUT"
            echo "Mode: manual full refresh"
          elif [ ! -f data/models.json ] || [ ! -f data/repos.json ]; then
            echo "run_fetch=true" >> "$GITHUB_OUTPUT"
            echo "Mode: bootstrap fetch (missing cached data files)"
          else
            echo "run_fetch=false" >> "$GITHUB_OUTPUT"
            echo "Mode: static-only fast rebuild using existing verified data (0 LLM calls, $0.00 AI cost)"
          fi

      - name: Run Python adversarial, cumulative budget, policy & GSC unit test suite
        run: python3 -m unittest discover -s tests -v

      - name: Fetch latest public LLM pricing, history snapshots & Repository-Verified repos
        if: steps.mode.outputs.run_fetch == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m scripts.fetch_data

      - name: Check official Free LLM API provider policy freshness & drift (0 LLM calls)
        if: steps.mode.outputs.run_fetch == 'true'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python3 -m scripts.check_free_policies

      - name: Incremental enrichment with SHA-256 hash cache & true cumulative daily cost cap
        if: steps.mode.outputs.run_fetch == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: python3 -m scripts.enrich_llm

      - name: Build static site, tools, ad-free embeds & linkable data assets into dist/
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          DEPLOY_TARGET: ${{ steps.target.outputs.host }}
          SYSV_PREVIEW_MODE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: python3 -m scripts.build_site

      - name: Run Technical Quality Gate (health_check)
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python3 -m scripts.health_check

      - name: Run Independent SEO Indexing Quality Gate (seo_gate)
        run: python3 -m scripts.seo_gate

      - name: Run Phase 2 Advertising Policy & Monetization Readiness Gate (ad_policy_gate)
        env:
          SYSV_PREVIEW_MODE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: python3 -m scripts.ad_policy_gate

      - name: Run real JS engine + Headless Chrome mobile (375px) interactive calculator verification
        run: node tests/test_calculators_runtime.mjs

      - name: Deploy dist/ to Cloudflare Pages (exclusive when configured)
        if: github.event_name != 'pull_request' && steps.target.outputs.host == 'cloudflare-pages'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sysv-site

      - name: Setup GitHub Pages (exclusive fallback when Cloudflare Pages not configured)
        if: github.event_name != 'pull_request' && steps.target.outputs.host == 'github-pages'
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        if: github.event_name != 'pull_request' && steps.target.outputs.host == 'github-pages'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload updated data snapshots & ops ledger (always, so LLM spend is never lost on failure)
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sysv-data-snapshot
          path: data/
          retention-days: 1

  deploy-pages:
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.deploy_target == 'github-pages'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  finalize:
    needs: [build, deploy-pages]
    if: always() && github.event_name != 'pull_request' && needs.build.result == 'success' && (needs.deploy-pages.result == 'success' || needs.deploy-pages.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download updated data snapshots
        uses: actions/download-artifact@v4
        with:
          name: sysv-data-snapshot
          path: data/

      - name: Record verified publish_success=true in ops ledger
        run: python3 -m scripts.record_deploy_status --status success --commit "${GITHUB_SHA::7}"

      - name: Commit data snapshots, policy database, permanent registries & ops ledger (after deploy)
        run: |
          git config user.name "sysv-bot"
          git config user.email "bot@sysv.cn"
          git add data/models.json data/repos.json data/price_changes.json data/published_comparisons.json data/published_pages.json data/selection_audit.json data/ops_metrics.json data/free_provider_policies.json data/history/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): daily snapshot & registry $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Ping IndexNow for changed URLs only (optional)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python3 -m scripts.indexnow_ping

  notify-failure:
    needs: [build, deploy-pages, finalize]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build ops ledger artifact if available (preserve AI spend on deploy failure)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: sysv-data-snapshot
          path: data/

      - name: Persist ops_metrics.json & publish_success=false so AI spend is never lost
        continue-on-error: true
        run: |
          python3 -m scripts.record_deploy_status --status failure --commit "${GITHUB_SHA::7}"
          git config user.name "sysv-bot"
          git config user.email "bot@sysv.cn"
          git add data/ops_metrics.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(ops): record failed deploy & spend $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Notify anomaly via PushPlus or Webhook (failure only)
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python3 -c '
          import json, os, urllib.request
          msg = "SysV (sysv.cn) daily pipeline FAILED. Please inspect GitHub Actions logs."
          pp = os.getenv("PUSHPLUS_TOKEN", "").strip()
          if pp:
              payload = json.dumps({"token": pp, "title": "[SysV] Pipeline Alert", "content": msg, "template": "txt"}).encode()
              req = urllib.request.Request("https://www.pushplus.plus/send", data=payload, headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req, timeout=12)
          wh = os.getenv("ALERT_WEBHOOK_URL", "").strip()
          if wh:
              payload = json.dumps({"text": msg}).encode()
              req = urllib.request.Request(wh, data=payload, headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req, timeout=12)
          '
