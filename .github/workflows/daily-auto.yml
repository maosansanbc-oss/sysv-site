name: Daily Auto Update & Deploy (sysv.cn)

on:
  schedule:
    # Runs every day at 02:15 UTC (10:15 Beijing Time)
    - cron: "15 2 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "site.config.json"
      - ".github/workflows/daily-auto.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cryptography for GSC auth unit tests
        run: python3 -m pip install --quiet cryptography

      - name: Select mutually exclusive production deploy target
        id: target
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "host=cloudflare-pages" >> "$GITHUB_OUTPUT"
            echo "Production deploy target: cloudflare-pages (GitHub Pages skipped)"
          else
            echo "host=github-pages" >> "$GITHUB_OUTPUT"
            echo "Production deploy target: github-pages (Cloudflare Pages skipped)"
          fi

      - name: Run Python adversarial, cross-day lastmod & GSC unit test suite
        run: python3 -m unittest discover -s tests -v

      - name: Fetch latest public LLM pricing, history snapshots & Repository-Verified repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m scripts.fetch_data

      - name: Incremental enrichment with SHA-256 hash cache & hard daily cost cap
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: python3 -m scripts.enrich_llm

      - name: Build static site, tools, ad-free embeds & linkable data assets into dist/
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          DEPLOY_TARGET: ${{ steps.target.outputs.host }}
        run: python3 -m scripts.build_site

      - name: Run Technical Quality Gate (health_check)
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python3 -m scripts.health_check

      - name: Run Independent SEO Indexing Quality Gate (seo_gate)
        run: python3 -m scripts.seo_gate

      - name: Run real JS engine + Headless Chrome mobile (375px) interactive calculator verification
        run: node tests/test_calculators_runtime.mjs

      - name: Deploy dist/ to Cloudflare Pages (exclusive when configured)
        if: steps.target.outputs.host == 'cloudflare-pages'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sysv-site

      - name: Setup GitHub Pages (exclusive fallback when Cloudflare Pages not configured)
        if: steps.target.outputs.host == 'github-pages'
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        if: steps.target.outputs.host == 'github-pages'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.target.outputs.host == 'github-pages'
        uses: actions/deploy-pages@v4

      - name: Commit data snapshots, permanent registries & ops ledger (after deploy)
        run: |
          git config user.name "sysv-bot"
          git config user.email "bot@sysv.cn"
          git add data/models.json data/repos.json data/price_changes.json data/published_comparisons.json data/published_pages.json data/selection_audit.json data/ops_metrics.json data/history/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): daily snapshot & registry $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Ping IndexNow for changed URLs only (optional)
        if: success()
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python3 -m scripts.indexnow_ping

      - name: Notify anomaly via PushPlus or Webhook (failure only)
        if: failure()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python3 -c '
          import json, os, urllib.request
          msg = "SysV (sysv.cn) daily pipeline FAILED. Please inspect GitHub Actions logs."
          pp = os.getenv("PUSHPLUS_TOKEN", "").strip()
          if pp:
              payload = json.dumps({"token": pp, "title": "[SysV] Pipeline Alert", "content": msg, "template": "txt"}).encode()
              req = urllib.request.Request("https://www.pushplus.plus/send", data=payload, headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req, timeout=12)
          wh = os.getenv("ALERT_WEBHOOK_URL", "").strip()
          if wh:
              payload = json.dumps({"text": msg}).encode()
              req = urllib.request.Request(wh, data=payload, headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req, timeout=12)
          '
