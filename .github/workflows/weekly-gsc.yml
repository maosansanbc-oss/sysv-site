name: Weekly GSC Search Analytics & URL Inspection (Private Artifact Only)

on:
  schedule:
    # Every Monday at 03:00 UTC (11:00 Beijing Time)
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  # Read-only repository access: NEVER commit search queries, traffic, conversions, or revenue to public git!
  contents: read

jobs:
  gsc-weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cryptography for Service Account RS256 JWT signing
        run: python3 -m pip install --quiet cryptography

      - name: Run GSC Search Analytics & URL Inspection API collector (writes strictly to private/gsc/)
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'sc-domain:sysv.cn' }}
          GSC_INSPECT_LIMIT: "25"
        run: python3 -m scripts.gsc_report

      - name: Upload private GSC report as restricted workflow artifact (never committed to public git)
        uses: actions/upload-artifact@v4
        with:
          name: private-gsc-weekly-report
          path: private/gsc/
          retention-days: 30

      - name: Send private weekly summary via PushPlus / Webhook (optional)
        if: success()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python3 -c '
          import json, os, pathlib, urllib.request
          p = pathlib.Path("private/gsc/gsc_weekly_report.json")
          if not p.exists():
              raise SystemExit(0)
          rep = json.loads(p.read_text(encoding="utf-8"))
          msg = (
              f"SysV Weekly GSC ({rep[\"date_range\"][\"start_date\"]}..{rep[\"date_range\"][\"end_date\"]}) "
              f"auth={rep[\"auth_mode\"]} totals={rep[\"site_totals\"]} buckets={rep[\"diagnostic_buckets\"]}"
          )
          pp = os.getenv("PUSHPLUS_TOKEN", "").strip()
          if pp:
              payload = json.dumps({"token": pp, "title": "[SysV] Weekly GSC Summary", "content": msg, "template": "txt"}).encode()
              urllib.request.urlopen(urllib.request.Request("https://www.pushplus.plus/send", data=payload, headers={"Content-Type": "application/json"}), timeout=12)
          wh = os.getenv("ALERT_WEBHOOK_URL", "").strip()
          if wh:
              payload = json.dumps({"text": msg}).encode()
              urllib.request.urlopen(urllib.request.Request(wh, data=payload, headers={"Content-Type": "application/json"}), timeout=12)
          '

      - name: Notify auth or API failure via PushPlus / Webhook (failure only)
        if: failure()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python3 -c '
          import json, os, urllib.request
          msg = "SysV Weekly GSC workflow FAILED (check Service Account / OAuth refresh auth or API logs)."
          pp = os.getenv("PUSHPLUS_TOKEN", "").strip()
          if pp:
              payload = json.dumps({"token": pp, "title": "[SysV] Weekly GSC Auth/API Alert", "content": msg, "template": "txt"}).encode()
              req = urllib.request.Request("https://www.pushplus.plus/send", data=payload, headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req, timeout=12)
          wh = os.getenv("ALERT_WEBHOOK_URL", "").strip()
          if wh:
              payload = json.dumps({"text": msg}).encode()
              req = urllib.request.Request(wh, data=payload, headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req, timeout=12)
          '
